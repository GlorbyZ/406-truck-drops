<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account | 406 Cheap Rides</title>
  <meta name="description" content="Sign in to 406 Cheap Rides and manage your plan." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip" href="#account">Skip to account</a>
  <header class="wrap top">
    <a class="brand" href="/">406 <span>Cheap Rides</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="/#deals">Deals</a>
      <a href="/pricing">Pricing</a>
      <a href="/account">Account</a>
    </nav>
  </header>

  <main class="wrap page" id="account">
    <p class="eyebrow">Account</p>
    <h1>Your plan</h1>
    <p id="account-banner" class="msg" hidden></p>

    <section id="signed-out" class="panel">
      <h2>Sign in</h2>
      <p>We email you a one-time link. No password.</p>
      <form id="login-form" class="form">
        <label>Email
          <input type="email" name="email" autocomplete="email" required placeholder="you@example.com" />
        </label>
        <button class="btn" type="submit">Email me a sign-in link</button>
        <p id="login-msg" class="msg" role="status"></p>
      </form>
    </section>

    <section id="signed-in" class="panel" hidden>
      <dl class="facts">
        <div><dt>Email</dt><dd id="acct-email"></dd></div>
        <div><dt>Plan</dt><dd id="acct-plan"></dd></div>
        <div><dt>Status</dt><dd id="acct-status"></dd></div>
        <div><dt id="acct-until-label">Paid until</dt><dd id="acct-until"></dd></div>
      </dl>
      <p id="past-due-note" class="msg bad" hidden>The last payment failed. Update your card in billing.</p>
      <div class="row">
        <a class="btn" id="billing-link" href="/api/portal">Manage billing</a>
        <a class="btn secondary" href="/pricing">Change plan</a>
        <button class="btn secondary" id="logout-btn" type="button">Log out</button>
      </div>
    </section>
  </main>

  <footer class="wrap footer">
    <span>406 Cheap Rides</span>
    <span>
      <a href="/terms">Terms</a>
      ·
      <a href="/privacy">Privacy</a>
    </span>
  </footer>
  <script src="/site.js"></script>
</body>
</html>
